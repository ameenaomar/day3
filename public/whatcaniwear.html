<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>What Can I Wear</title>
<meta name="description" content="A personal stylist for Kuwait. Answer a few questions and a stylist puts a full look together, sourced from Kuwait boutiques and delivered to your door.">
<link rel="icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
</head>
<body>

<style>
/* ============ tokens: beige machine (light) ============ */
:root{
  --paper:#E5DCC6;
  --panel:#F4EEE0;
  --well:#FCF9F1;
  --inset:#DDD2B9;
  --rule:#B5A382;
  --rule-soft:#CCBEA0;
  --brown:#33200F;
  --brown-soft:#6A4E35;
  --dim:#8A7455;
  --green:#1D6B3B;
  --green-wash:#DCE8D6;
  --red:#A32219;
  --red-wash:#F2DED9;
  --hard:2px 2px 0 0 var(--rule);
  --scan:none;
  --mono:"IBM Plex Mono",ui-monospace,"Courier New",monospace;
  --crt:"VT323","IBM Plex Mono",monospace;
  --arabic:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
/* ============ tokens: CRT (dark) ============ */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#100D0A;
    --panel:#1A1611;
    --well:#221C15;
    --inset:#251F17;
    --rule:#54422E;
    --rule-soft:#3A2E20;
    --brown:#EFE3C9;
    --brown-soft:#BCA684;
    --dim:#8E7A5C;
    --green:#4CD97C;
    --green-wash:#17301F;
    --red:#EC5D50;
    --red-wash:#331713;
    --hard:2px 2px 0 0 #000;
    --scan:repeating-linear-gradient(180deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#100D0A;
  --panel:#1A1611;
  --well:#221C15;
  --inset:#251F17;
  --rule:#54422E;
  --rule-soft:#3A2E20;
  --brown:#EFE3C9;
  --brown-soft:#BCA684;
  --dim:#8E7A5C;
  --green:#4CD97C;
  --green-wash:#17301F;
  --red:#EC5D50;
  --red-wash:#331713;
  --hard:2px 2px 0 0 #000;
  --scan:repeating-linear-gradient(180deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--brown);
  font-family:var(--mono);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
body[dir="rtl"]{font-family:var(--arabic)}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px 60px}

/* ============ machine header ============ */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:4px 0 12px}
.logo{
  font-family:var(--crt);font-size:30px;line-height:1;letter-spacing:.06em;
  text-transform:uppercase;color:var(--brown);margin-inline-end:auto;direction:ltr;
}
.logo b{color:var(--red);font-weight:400}
.ghost{
  font:inherit;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  background:var(--panel);border:1px solid var(--rule);color:var(--brown-soft);
  padding:6px 10px;cursor:pointer;box-shadow:var(--hard);
}
.ghost:hover{color:var(--brown);border-color:var(--brown)}
.ghost:active{box-shadow:none;transform:translate(2px,2px)}
.who{
  display:none;align-items:center;gap:7px;font-size:11.5px;font-weight:600;
  color:var(--brown-soft);border:1px solid var(--rule);background:var(--panel);padding:5px 8px;
}
.who.on{display:inline-flex}
.who i{font-style:normal;color:var(--green);font-weight:700}
.who em{font-style:normal;max-width:11ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase}
.who button{font:inherit;font-size:10.5px;font-weight:600;letter-spacing:.05em;background:none;border:0;cursor:pointer;color:var(--dim);text-transform:uppercase;padding:0 2px}
.who button:hover{color:var(--red);text-decoration:underline}

/* ============ progress ============ */
.rail{
  display:none;direction:ltr;font-size:12.5px;letter-spacing:.02em;color:var(--dim);
  padding:0 0 12px;gap:10px;align-items:center;
}
.rail.on{display:flex}
.rail b{color:var(--brown);font-weight:600}
.rail u{text-decoration:none;color:var(--green);letter-spacing:-.06em}
.rail s{text-decoration:none;color:var(--rule-soft);letter-spacing:-.06em}

/* ============ panel ============ */
.card{
  background:var(--panel);border:1px solid var(--rule);box-shadow:var(--hard);
  background-image:var(--scan);
}
.tb{
  display:flex;justify-content:space-between;gap:10px;align-items:center;
  border-bottom:1px solid var(--rule);padding:7px 12px;
  font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--panel);background:var(--brown);direction:ltr;
}
.tb span:last-child{color:var(--dim)}
.pad{padding:20px 18px}

.eyebrow{
  font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin-bottom:9px;
}
.eyebrow b{color:var(--green);font-weight:700}
body[dir="rtl"] .eyebrow{letter-spacing:.02em}
h1.crt{
  font-family:var(--crt);font-weight:400;font-size:42px;line-height:1.02;
  margin:0 0 10px;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance;
}
body[dir="rtl"] h1.crt{font-family:var(--arabic);font-size:27px;line-height:1.25;font-weight:600;text-transform:none}
h2.q{font-size:19px;line-height:1.3;margin:0 0 6px;font-weight:600;text-wrap:balance}
h2.q::before{content:"> ";color:var(--green)}
body[dir="rtl"] h2.q::before{content:"< "}
.sub{color:var(--brown-soft);font-size:13px;margin:0 0 4px;max-width:60ch}
.cursor{display:inline-block;width:.55em;height:1em;background:var(--green);vertical-align:-.12em;animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}

/* ============ fields ============ */
.field{margin-top:19px;padding-top:16px;border-top:1px dashed var(--rule-soft)}
.field.first{border-top:0;padding-top:0}
.label{
  font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--brown);margin-bottom:9px;display:block;
}
.label i{font-style:normal;color:var(--dim);font-weight:400;letter-spacing:.05em}
.label u{text-decoration:none;color:var(--red)}
body[dir="rtl"] .label{letter-spacing:.02em}
.hint{font-size:12px;color:var(--dim);margin-top:8px;max-width:62ch}
.err{font-size:12px;color:var(--red);margin-top:12px;font-weight:600;background:var(--red-wash);border:1px solid var(--red);padding:8px 10px}

/* ============ chips ============ */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font:inherit;font-size:13px;font-weight:500;text-align:start;
  background:var(--well);border:1px solid var(--rule-soft);color:var(--brown);
  padding:8px 11px;cursor:pointer;
}
.chip:hover{border-color:var(--brown);background:var(--inset)}
.chip[aria-pressed="true"]{border-color:var(--green);background:var(--green-wash);color:var(--brown);font-weight:600}
.chip var{font-style:normal;color:var(--dim);font-weight:600;margin-inline-end:6px}
.chip[aria-pressed="true"] var{color:var(--green)}
.chip small{display:block;font-size:11px;font-weight:400;color:var(--dim);margin-top:1px;line-height:1.32}
.chip.sz{min-width:52px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.chips.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr))}
.chips.grid .chip{padding:8px 10px}
.chips.wide{display:grid;grid-template-columns:1fr}

/* ============ tone swatches ============ */
.tones{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:6px}
.tone{font:inherit;text-align:start;background:var(--well);cursor:pointer;border:1px solid var(--rule-soft);padding:10px;color:var(--brown)}
.tone:hover{border-color:var(--brown)}
.tone[aria-pressed="true"]{border-color:var(--green);background:var(--green-wash)}
.tone b{display:block;font-size:13px;font-weight:600;margin-bottom:2px}
.tone b var{font-style:normal;color:var(--dim);margin-inline-end:5px}
.tone[aria-pressed="true"] b var{color:var(--green)}
.tone em{font-style:normal;font-size:11.5px;color:var(--dim);display:block;line-height:1.35}
.sw{display:flex;margin-bottom:8px;height:24px;border:1px solid var(--rule-soft)}
.sw i{flex:1}

/* ============ inputs ============ */
input[type=text]{
  font:inherit;font-size:14px;width:100%;padding:10px 11px;color:var(--brown);
  background:var(--well);border:1px solid var(--rule);border-radius:0;
}
input[type=text]::placeholder{color:var(--dim)}
input[type=text]:focus{outline:2px solid var(--green);outline-offset:0;border-color:var(--green)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.mrow label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brown-soft);margin-bottom:5px}
body[dir="rtl"] .mrow label{letter-spacing:.02em}
.mrow{position:relative}
.mrow em{
  position:absolute;inset-inline-end:10px;bottom:11px;font-style:normal;
  font-size:11px;color:var(--dim);pointer-events:none;
}
.mrow input{padding-inline-end:34px;font-variant-numeric:tabular-nums}
.toggle{
  font:inherit;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  background:var(--inset);border:1px dashed var(--rule);color:var(--brown-soft);
  padding:9px 12px;cursor:pointer;width:100%;text-align:start;
}
.toggle:hover{border-color:var(--brown);color:var(--brown);border-style:solid}
.toggle var{font-style:normal;color:var(--green);font-weight:700;margin-inline-end:7px}

/* ============ nav ============ */
.nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px solid var(--rule)}
.btn{
  font:inherit;font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;
  background:var(--brown);color:var(--panel);border:1px solid var(--brown);
  padding:12px 20px;box-shadow:var(--hard);
}
.btn:hover{background:var(--green);border-color:var(--green)}
:root[data-theme="dark"] .btn:hover,
.btn:hover{color:var(--panel)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:hover{color:#100D0A}}
:root[data-theme="dark"] .btn:hover{color:#100D0A}
.btn:active{box-shadow:none;transform:translate(2px,2px)}
.btn[disabled]{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn.wide{width:100%;text-align:center}
.back{
  font:inherit;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  background:none;border:0;color:var(--dim);cursor:pointer;padding:8px 2px;margin-inline-end:auto;
}
.back:hover{color:var(--red);text-decoration:underline}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* ============ landing bits ============ */
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.tag{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--brown-soft);border:1px solid var(--rule-soft);padding:5px 9px}
.priceline{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin:18px 0 2px;padding-top:15px;border-top:1px solid var(--rule)}
.priceline b{font-family:var(--crt);font-size:40px;line-height:.9;font-weight:400;color:var(--red);font-variant-numeric:tabular-nums}
body[dir="rtl"] .priceline b{font-family:var(--arabic);font-size:26px;font-weight:700;line-height:1.2}
.priceline span{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.steps{list-style:none;margin:18px 0 0;padding:0;border:1px solid var(--rule-soft)}
.steps li{padding:11px 12px;display:flex;gap:11px;align-items:flex-start;font-size:13px;border-bottom:1px dashed var(--rule-soft);background:var(--well)}
.steps li:last-child{border-bottom:0}
.steps li b{color:var(--green);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.steps li strong{font-weight:600}
.steps li em{font-style:normal;color:var(--dim);display:block;font-size:12px}

/* ============ profile ============ */
.rsw{display:flex;gap:5px;margin:2px 0}
.rsw div{flex:1;text-align:center}
.rsw i{display:block;height:40px;border:1px solid var(--rule-soft)}
.rsw span{font-size:10px;letter-spacing:.03em;text-transform:uppercase;color:var(--dim);display:block;margin-top:4px;line-height:1.25}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
@media (max-width:540px){.two{grid-template-columns:1fr}}
.box{background:var(--well);border:1px solid var(--rule-soft);padding:12px}
.box h3{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;margin:0 0 8px}
body[dir="rtl"] .box h3{letter-spacing:.02em}
.box.yes{border-inline-start:3px solid var(--green)}
.box.yes h3{color:var(--green)}
.box.no{border-inline-start:3px solid var(--red)}
.box.no h3{color:var(--red)}
.box ul{margin:0;padding:0;list-style:none;font-size:12.5px;display:grid;gap:6px}
.box li{display:flex;gap:7px}
.box li::before{content:"+";color:var(--green);font-weight:700;flex:none}
.box.no li::before{content:"-";color:var(--red)}
.box li span::first-letter{text-transform:uppercase}
.readout{background:var(--well);border:1px solid var(--rule-soft);padding:11px 12px;font-size:12.5px;display:grid;gap:4px}
.readout div{display:flex;gap:10px}
.readout dt{color:var(--dim);min-width:11ch;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
.readout dd{margin:0;font-weight:600}

/* ============ money ============ */
.summary{border:1px solid var(--rule);margin-bottom:4px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;font-size:13px;border-bottom:1px dashed var(--rule-soft);background:var(--well)}
.row:last-child{border-bottom:0}
.row span:last-child{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.row em{font-style:normal;color:var(--dim);font-size:11.5px;display:block;font-weight:400}
.row.total{background:var(--brown);color:var(--panel);font-weight:700;font-size:15px}
.row.total em{color:var(--dim)}
.pay{display:grid;gap:6px}
.paybtn{
  font:inherit;font-size:13px;font-weight:600;text-align:start;cursor:pointer;color:var(--brown);
  background:var(--well);border:1px solid var(--rule-soft);padding:11px 12px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.paybtn:hover{border-color:var(--brown)}
.paybtn[aria-pressed="true"]{border-color:var(--green);background:var(--green-wash)}
.paybtn u{text-decoration:none;font-size:10px;font-weight:700;letter-spacing:.08em;border:1px solid var(--rule);padding:3px 5px;color:var(--brown-soft);direction:ltr}
.paybtn[aria-pressed="true"] u{border-color:var(--green);color:var(--green)}
.paybtn em{font-style:normal;font-weight:400;font-size:11.5px;color:var(--dim);margin-inline-start:auto;text-align:end}
.terms{margin-top:14px;display:grid;gap:6px}
.terms p{margin:0;font-size:11.5px;color:var(--dim);display:flex;gap:8px}
.terms p b{color:var(--brown);font-weight:700;white-space:nowrap;letter-spacing:.04em;text-transform:uppercase;font-size:10.5px;padding-top:1px}

/* ============ done ============ */
.stamp{
  font-family:var(--crt);font-size:34px;line-height:1;color:var(--green);
  border:2px solid var(--green);display:inline-block;padding:4px 12px 2px;margin-bottom:12px;
  text-transform:uppercase;letter-spacing:.08em;direction:ltr;
}
.foot{text-align:center;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:18px 8px 0}
[hidden]{display:none !important}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
@media (max-width:480px){
  .pad{padding:17px 14px}
  h1.crt{font-size:34px}
  body[dir="rtl"] h1.crt{font-size:23px}
  .logo{font-size:24px}
  h2.q{font-size:17px}
}
</style>

<div class="wrap">
  <div class="bar">
    <div class="logo">WHAT CAN I WEAR<b>?</b></div>
    <span class="who" id="who"></span>
    <button class="ghost" id="lang" type="button">العربية</button>
  </div>
  <div class="rail" id="rail"></div>
  <div id="app"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
"use strict";
var lang="en";
var t=function(o){return (o&&o[lang])||"";};
var A={};                      /* answers */
var U={name:"",email:""};      /* signed-in customer */
var view="login", qi=0, loginErr=false, showExact=false;

function firstName(){return (U.name||"").trim().split(/\s+/)[0]||"";}
function initials(){var p=(U.name||"").trim().split(/\s+/).filter(Boolean);
  return p.length?(p[0][0]+(p.length>1?p[p.length-1][0]:"")).toUpperCase():"?";}
function validEmail(v){return /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test((v||"").trim());}
function signedIn(){return (U.name||"").trim().length>1&&validEmail(U.email);}

/* ================= copy ================= */
var UI={
  sys:{en:"WHAT CAN I WEAR",ar:"WHAT CAN I WEAR"},
  ver:{en:"KWT · v1.0",ar:"KWT · v1.0"},
  /* front page */
  fpTag:{en:"Personal styling · Kuwait",ar:"تنسيق شخصي · الكويت"},
  fpH:{en:"Answer the questions. Get the outfit.",ar:"أجيبي على الأسئلة. تصلك الإطلالة."},
  fpL:{en:"Seven short screens about your body, your colours and the occasion. A stylist shops Kuwait for you and the look arrives at your door.",ar:"سبع شاشات قصيرة عن جسمك وألوانك والمناسبة. تشتري لك المنسّقة من الكويت وتصل الإطلالة إلى بابك."},
  fName:{en:"Operator name",ar:"الاسم"},
  fNameP:{en:"First and last name",ar:"الاسم الأول والأخير"},
  fEmail:{en:"Email",ar:"البريد الإلكتروني"},
  fEmailP:{en:"you@example.com",ar:"you@example.com"},
  fEmailH:{en:"Your style profile and order updates are sent here. No marketing unless you ask for it.",ar:"يُرسل ملفك وتحديثات طلبك إلى هنا. لا رسائل ترويجية إلا بطلبك."},
  fGo:{en:"Open my file",ar:"افتحي ملفي"},
  fBad:{en:"Name and a valid email are required to continue.",ar:"الاسم وبريد إلكتروني صحيح مطلوبان للمتابعة."},
  fReturn:{en:"Been here before? The same email loads your saved measurements.",ar:"زبونة سابقة؟ البريد نفسه يستعيد مقاساتك المحفوظة."},
  signout:{en:"Log out",ar:"خروج"},
  hi:{en:"User",ar:"المستخدمة"},
  acct:{en:"Account",ar:"الحساب"},
  /* landing */
  h1:{en:"One look, put together for you.",ar:"إطلالة كاملة، منسّقة لك."},
  fee:{en:"per look · styling",ar:"لكل إطلالة · التنسيق"},
  feeNote:{en:"The clothing budget is separate and you set it. Anything unspent is refunded.",ar:"ميزانية الملابس منفصلة وتحددينها أنت. يُعاد أي مبلغ غير مستخدم."},
  start:{en:"Run — about 2 minutes",ar:"ابدئي — حوالي دقيقتين"},
  p1:{en:"Seven screens, mostly taps",ar:"سبع شاشات، معظمها بلمسة"},
  p1s:{en:"Real measurements if you have them, honest estimates if you do not.",ar:"مقاسات دقيقة إن توفرت، أو تقديرات صادقة إن لم تتوفر."},
  p2:{en:"Your style profile, free",ar:"ملفك الشخصي، مجاناً"},
  p2s:{en:"Your palette and your silhouette on screen before you pay anything.",ar:"لوحة ألوانك وقَصّتك على الشاشة قبل أي دفع."},
  p3:{en:"Delivered in 3–5 days",ar:"التوصيل في ٣–٥ أيام"},
  p3s:{en:"Try it at home. Keep the look or return it free within 3 days.",ar:"قيسيها في البيت. احتفظي بها أو أرجعيها مجاناً خلال ٣ أيام."},
  tr:{en:["Kuwait only","KNET & Apple Pay","Free returns","Women & men"],ar:["الكويت فقط","كي نت وآبل باي","إرجاع مجاني","نساء ورجال"]},
  next:{en:"Continue",ar:"متابعة"},
  back:{en:"Back",ar:"رجوع"},
  file:{en:"FILE",ar:"FILE"},
  pick:{en:"Answer the fields marked with * to continue.",ar:"أجيبي على الحقول المعلّمة بـ * للمتابعة."},
  optional:{en:"optional",ar:"اختياري"},
  /* measurements */

  if(f.type==="text"||f.type==="exact"||f.opt) return true;
  if(f.type==="many") return (A[f.key]||[]).length>0;
  return !!A[f.key];
}
function stepReady(step){return activeFields(step).every(fieldReady);}
function lastPickable(step){var f=activeFields(step).slice(-1)[0];return (f&&f.type==="one")?f:null;}
function blocks(done,total){
  var s="";for(var i=0;i<total;i++)s+="█";return s;
}

function render(){
  document.body.setAttribute("dir",lang==="ar"?"rtl":"ltr");
  document.body.lang=lang;
  document.getElementById("lang").textContent=lang==="ar"?"English":"العربية";
  document.getElementById("foot").textContent=t(UI.footer);

  var rail=document.getElementById("rail");rail.innerHTML="";
  rail.className=(view==="quiz")?"rail on":"rail";
  if(view==="quiz"){
    rail.appendChild(el("b",null,t(UI.file)+" "+(qi+1)+"/"+Q.length));
    var bar=el("span");
    bar.appendChild(el("u",null,blocks(0,qi+1)));
    if(qi+1<Q.length) bar.appendChild(el("s",null,blocks(0,Q.length-qi-1)));
    rail.appendChild(bar);
    rail.appendChild(el("span",null,t(Q[qi].tag).toUpperCase()));
  }

  var w=document.getElementById("who");w.innerHTML="";
  w.className=(view!=="login"&&signedIn())?"who on":"who";
  if(view!=="login"&&signedIn()){
    w.appendChild(el("i",null,initials()));
    w.appendChild(el("em",null,firstName()));
    var so=el("button",null,t(UI.signout));so.type="button";
    so.onclick=function(){U={name:"",email:""};A={};qi=0;loginErr=false;showExact=false;view="login";render();};
    w.appendChild(so);
  }

  var app=document.getElementById("app");app.innerHTML="";
  var v = view==="login"?login():view==="landing"?landing():view==="quiz"?quiz():
          view==="profile"?profile():view==="pay"?pay():done();
  app.appendChild(v);
  window.scrollTo(0,0);
}

/* ---------------- quiz ---------------- */
function quiz(){
  var step=Q[qi],c=panel(),p=c.body,firstDone=false;
  var eb=el("div","eyebrow");
  eb.appendChild(el("b",null,t(UI.file)+" "+(qi+1)+"/"+Q.length));
  eb.appendChild(document.createTextNode(" · "+t(step.tag)));
  p.appendChild(eb);
  p.appendChild(el("h2","q",t(step.q)));
  p.appendChild(el("p","sub",t(step.sub)));

  activeFields(step).forEach(function(f){
    if(f.needs&&!A[f.needs]) return;
    var wrap=el("div","field"+(firstDone?"":" first"));firstDone=true;

    if(f.type!=="exact"){
      var lab=el("span","label");
      lab.appendChild(document.createTextNode(t(f.label)));
      if(f.opt||f.type==="text") lab.appendChild(el("i",null," · "+t(UI.optional)));
      else lab.appendChild(el("u",null," *"));
      wrap.appendChild(lab);
    }

    if(f.type==="text"){
      var inp=document.createElement("input");inp.type="text";
      inp.placeholder=t(f.ph);inp.value=A[f.key]||"";
      inp.oninput=function(){A[f.key]=inp.value;};
      wrap.appendChild(inp);
      wrap.appendChild(el("p","hint",t(f.hint)));

    }else if(f.type==="exact"){
      var tg=el("button","toggle");tg.type="button";
      tg.appendChild(el("var",null,showExact?"[-]":"[+]"));
      tg.appendChild(document.createTextNode(showExact?t(UI.exactClose):t(UI.exactOpen)));
      tg.onclick=function(){showExact=!showExact;render();};
      wrap.appendChild(tg);
      if(showExact){
        var g=el("div","mgrid");g.style.marginTop="10px";
        EXACT.forEach(function(m2){
          if(m2[2]&&m2[2]!==who()) return;
          var r=el("div","mrow");
          var lb=document.createElement("label");lb.textContent=t(m2[1]);
          var i2=document.createElement("input");i2.type="text";i2.setAttribute("inputmode","numeric");
          i2.placeholder="—";i2.value=A[m2[0]]||"";i2.dir="ltr";
          i2.oninput=function(){A[m2[0]]=i2.value.replace(/[^\d.]/g,"");};
          r.appendChild(lb);r.appendChild(i2);r.appendChild(el("em",null,t(UI.cm)));
          g.appendChild(r);
        });
        wrap.appendChild(g);
        wrap.appendChild(el("p","hint",t(UI.exactH)));
      }

    }else if(f.type==="tone"){
      var box=el("div","tones");
      f.opts.forEach(function(o){
        var btn=el("button","tone");btn.type="button";
        var on=A[f.key]===o[0];
        btn.setAttribute("aria-pressed",on?"true":"false");
        var sw=el("div","sw");o[3].forEach(function(hex){var i3=el("i");i3.style.background=hex;sw.appendChild(i3);});
        btn.appendChild(sw);
        var bb=el("b");bb.appendChild(el("var",null,on?"(•)":"( )"));
        bb.appendChild(document.createTextNode(t(o[1])));btn.appendChild(bb);
        btn.appendChild(el("em",null,t(o[2])));
        btn.onclick=function(){A[f.key]=o[0];render();};
        box.appendChild(btn);
      });
      wrap.appendChild(box);

    }else{
      var chips=el("div","chips"+(f.grid?" grid":""));
      f.opts.forEach(function(o){
        var btn=el("button","chip"+(f.bare?" sz":""));btn.type="button";
        var on2=f.type==="many"?(A[f.key]||[]).indexOf(o[0])>-1:A[f.key]===o[0];
        btn.setAttribute("aria-pressed",on2?"true":"false");
        if(!f.bare) btn.appendChild(el("var",null,f.type==="many"?(on2?"[x]":"[ ]"):(on2?"(•)":"( )")));
        btn.appendChild(document.createTextNode(typeof o[1]==="string"?o[1]:t(o[1])));
        if(o[2]) btn.appendChild(el("small",null,t(o[2])));
        btn.onclick=function(){
          if(f.type==="many"){
            var arr=A[f.key]||[],ix=arr.indexOf(o[0]),solo=(o[0]==="nolayer"||o[0]==="nothing");
            if(solo){arr=ix>-1?[]:[o[0]];}
            else{if(ix>-1)arr.splice(ix,1);else arr.push(o[0]);
                 arr=arr.filter(function(v){return v!=="nolayer"&&v!=="nothing";});}
            A[f.key]=arr;render();
          }else{
            A[f.key]=o[0];
            if(f===lastPickable(step)&&qi<Q.length-1&&stepReady(step)) advance();
            else render();
          }
        };
        chips.appendChild(btn);
      });
      wrap.appendChild(chips);
    }
    p.appendChild(wrap);
  });

  if(qi===Q.length-1){var mb=el("div","field");mb.appendChild(orderSummary(false));p.appendChild(mb);}

  var nav=el("div","nav");
  var back=el("button","back","‹ "+t(UI.back));back.type="button";
  back.onclick=function(){if(qi===0)view="landing";else qi--;render();};
  nav.appendChild(back);
  var ready=stepReady(step);
  var nx=el("button","btn",(qi===Q.length-1?t(UI.prGo):t(UI.next))+" ›");nx.type="button";
  nx.disabled=!ready;nx.onclick=advance;
  nav.appendChild(nx);
  p.appendChild(nav);
  if(!ready) p.appendChild(el("p","hint","* "+t(UI.pick)));
  return c;
}
function advance(){ if(qi<Q.length-1)qi++; else view="profile"; render(); }

function readoutRows(){
  var out=[],w=who();
  var H=w==="women"?A.heightW:A.heightM;

  var sizes=[];
  if(A.top) sizes.push(A.top);
  var bot=w==="women"?A.bottomW:A.bottomM;
  if(bot) sizes.push((w==="women"?"EU ":"W")+bot);
  var sh=w==="women"?A.shoeW:A.shoeM;
  if(sh) sizes.push((lang==="ar"?"حذاء ":"shoe ")+sh);
  if(A.bra) sizes.push((lang==="ar"?"صدر ":"bra ")+A.bra);
  if(sizes.length) out.push([t(UI.dSize),sizes.join(" · ")]);

  var FR={narrow:{en:"narrow shoulders",ar:"كتفان ضيّقان"},average:{en:"average shoulders",ar:"كتفان متوسطان"},broad:{en:"broad shoulders",ar:"كتفان عريضان"}};
  var AR2={short:{en:"shorter arms",ar:"ذراعان أقصر"},average:{en:"average arms",ar:"ذراعان متوسطتان"},long:{en:"longer arms",ar:"ذراعان أطول"}};
  var TO={short:{en:"short body, long legs",ar:"جذع قصير وساقان طويلتان"},average:{en:"even proportions",ar:"تناسب متوازن"},long:{en:"long body, shorter legs",ar:"جذع طويل وساقان أقصر"}};
  var fr=[];
  if(A.shoulders) fr.push(t(FR[A.shoulders]));
  if(A.arms) fr.push(t(AR2[A.arms]));
  if(A.torso) fr.push(t(TO[A.torso]));
  if(fr.length) out.push([t(UI.dFrame),fr.join(" · ")]);

  var SW={hourglass:{en:"Waist narrowest",ar:"الوسط الأنحف"},pear:{en:"Hips widest",ar:"الأرداف الأعرض"},
          rectangle:{en:"Straight",ar:"مستقيم"},apple:{en:"Middle widest",ar:"الوسط الأعرض"},
          inverted:{en:"Shoulders widest",ar:"الكتفان الأعرض"},unsure:{en:"Stylist to judge",ar:"تقرر المنسّقة"}};
  var SM={slim:{en:"Slim",ar:"نحيف"},athletic:{en:"Athletic",ar:"رياضي"},average:{en:"Average",ar:"متوسط"},
          broad:{en:"Solid",ar:"ممتلئ"},unsure:{en:"Stylist to judge",ar:"يقرر المنسّق"}};
  var shp=w==="women"?(A.shapeW&&t(SW[A.shapeW])):(A.shapeM&&t(SM[A.shapeM]));
  if(shp) out.push([t(UI.dShape),shp]);

  var ex=[];

  });
  if(ex.length) out.push([t(UI.dExact),ex.join(" · ")+" "+(lang==="ar"?"سم":"cm")]);
  if(A.brand) out.push([lang==="ar"?"ماركة":"Fits",A.brand]);
  return out;

  var O={wedding:{en:"Floor-length with a structured shoulder",ar:"طول إلى الأرض مع كتف مبني"},
         eid:{en:"Something new in a soft, formal fabric",ar:"قطعة جديدة بقماش ناعم رسمي"},
         grad:{en:"A clean silhouette that photographs well",ar:"قَصّة نظيفة تظهر جيداً في الصور"},
         work:{en:"Three pieces that mix into six outfits",ar:"ثلاث قطع تتحول إلى ست إطلالات"},
         travel:{en:"Fabrics that survive a suitcase",ar:"أقمشة لا تتجعّد في الحقيبة"},
         everyday:{en:"Pieces you can wear twice a week without thinking",ar:"قطع تلبسينها مرتين أسبوعياً بلا تفكير"}};
  if(occ) out.push(t(O[occ]));
  out.push((lang==="ar"?"ألوان لوحتك: ":"Your palette: ")+pal.cols.slice(0,3).map(function(c2){return t(c2[1]);}).join(lang==="ar"?"، ":", "));
  var H=w==="women"?A.heightW:A.heightM;
  if(H&&/^<1|^150|^156|^165/.test(H)) out.push(lang==="ar"?"خطوط عمودية غير مقطوعة لإطالة القامة":"unbroken vertical lines to lengthen the line");
  if(H&&/176\+|186|191\+/.test(H)) out.push(lang==="ar"?"أطوال مطوّلة ومقاسات طويلة عند توفرها":"extra-long lengths and tall sizing where it exists");
  if(life.indexOf("office")>-1) out.push(lang==="ar"?"قطعة خارجية تجعل أي إطلالة رسمية":"one outer layer that makes any outfit office-ready");
  if(life.indexOf("uni")>-1) out.push(lang==="ar"?"حذاء مريح للمشي طول اليوم":"a shoe you can walk in all day");
  if(life.indexOf("active")>-1||life.indexOf("travel")>-1) out.push(lang==="ar"?"أقمشة تتمدد وتتنفس":"fabrics that stretch and breathe");
  if(love.indexOf("black")>-1) out.push(lang==="ar"?"الأسود والأبيض كأساس واللون في قطعة واحدة":"black and white as the base, colour in one piece");
  if(A.modest&&A.modest.indexOf("hijab")>-1) out.push(lang==="ar"?"فتحات رقبة وأطوال مناسبة للحجاب":"necklines and lengths that work with hijab");
  if(A.modest&&A.modest.indexOf("abaya")>-1) out.push(lang==="ar"?"طبقات خفيفة تُلبس تحت العباية":"light layers that sit under an abaya");
  return out.slice(0,5);
}
function rulesNo(){
  var out=[],nv=A.never||[];
  var M={tight:{en:"anything tight",ar:"القطع الضيّقة"},prints:{en:"loud prints",ar:"النقشات الصارخة"},
         heels:{en:"high heels",ar:"الكعب العالي"},neon:{en:"neon",ar:"الألوان الفاقعة"},
         crop:{en:"crop tops",ar:"البلوزات القصيرة"},logos:{en:"big logos",ar:"الشعارات الكبيرة"}};
  nv.forEach(function(k){if(M[k])out.push(t(M[k]));});
  if(A.sleeve==="long") out.push(lang==="ar"?"أي كم أقصر من الطويل":"any sleeve shorter than full length");
  if(A.sleeve==="threequarter") out.push(lang==="ar"?"الأكمام القصيرة وبلا أكمام":"short sleeves and sleeveless");
  if(A.length==="maxi") out.push(lang==="ar"?"أي طول أعلى من الكاحل":"anything above the ankle");
  if(A.length==="midi") out.push(lang==="ar"?"أي طول أعلى من الركبة":"anything above the knee");
  if(A.shoulders==="broad") out.push(lang==="ar"?"الأكتاف المبطنة والأكمام المنتفخة":"shoulder pads and puff sleeves");
  if(A.torso==="long") out.push(lang==="ar"?"البلوزات القصيرة التي ترتفع":"short tops that ride up");
  if(A.modest&&A.modest.indexOf("opaque")>-1) out.push(lang==="ar"?"الأقمشة الشفافة":"sheer fabrics");
  if(!out.length) out.push(lang==="ar"?"لا قيود — للمنسّقة حرية كاملة":"no restrictions — the stylist has a free hand");
  return out.slice(0,5);
}

/* ---------------- payment ---------------- */
function pay(){
  var m=money(),c=panel(),p=c.body,nx;
  p.appendChild(el("div","eyebrow",t(UI.payTag)));
  p.appendChild(el("h2","q",t(UI.payH)));
  p.appendChild(el("p","sub",t(UI.demo)));

  var f0=el("div","field first");
  var s=el("div","summary");
  s.appendChild(row(t(UI.acct),firstName(),U.email));
  s.appendChild(row(t(UI.rStyle)+" × "+m.looks,cur(m.styling)));
  s.appendChild(row(t(UI.rBudget)+" × "+m.looks,cur(m.clothes),t(UI.rBudgetE)));
  s.appendChild(row(t(UI.rShip),m.ship?cur(m.ship):t(UI.free),t(UI.tShip)));
  var tt=row(t(UI.rTotal),cur(m.total));tt.className="row total";s.appendChild(tt);
  f0.appendChild(s);p.appendChild(f0);

  function ok(){return !!(A.method&&(A.phone||"").replace(/\D/g,"").length>=8);}

  var pf=el("div","field");
  pf.appendChild(el("span","label",t(UI.phone)));
  var inp=document.createElement("input");inp.type="text";inp.placeholder=t(UI.phoneP);
  inp.value=A.phone||"";inp.dir="ltr";inp.setAttribute("inputmode","tel");
  inp.oninput=function(){A.phone=inp.value;if(nx)nx.disabled=!ok();};
  pf.appendChild(inp);pf.appendChild(el("p","hint",t(UI.phoneH)));
  p.appendChild(pf);

  var mf=el("div","field");
  mf.appendChild(el("span","label",t(UI.payWith)));
  var box=el("div","pay");
  [["knet",UI.knet,"KNET",UI.knetE],["apple",UI.apay,"PAY",null],["card",UI.card,"VISA",null],
   ["tabby",UI.tabby,"TABBY",{en:kd(m.total/4)+" KD × 4",ar:"٤ × "+kd(m.total/4)+" د.ك"}]].forEach(function(mm){
    var b=el("button","paybtn");b.type="button";
    b.setAttribute("aria-pressed",A.method===mm[0]?"true":"false");
    b.appendChild(el("u",null,mm[2]));
    b.appendChild(el("span",null,t(mm[1])));
    if(mm[3]) b.appendChild(el("em",null,t(mm[3])));
    b.onclick=function(){A.method=mm[0];render();};
    box.appendChild(b);
  });
  mf.appendChild(box);p.appendChild(mf);

  var terms=el("div","terms");
  [[UI.tShip,UI.tShipD],[UI.tSize,UI.tSizeD],[UI.tRet,UI.tRetD]].forEach(function(x){
    var r2=el("p");r2.appendChild(el("b",null,t(x[0])));
    r2.appendChild(document.createTextNode(t(x[1])));terms.appendChild(r2);
  });
  p.appendChild(terms);

  var nav=el("div","nav");
  var back=el("button","back","‹ "+t(UI.back));back.type="button";
  back.onclick=function(){view="profile";render();};
  nav.appendChild(back);
  nx=el("button","btn",t(UI.payBtn)+" "+cur(m.total));nx.type="button";
  nx.disabled=!ok();
  nx.onclick=function(){view="done";render();};
  nav.appendChild(nx);p.appendChild(nav);
  return c;
}
