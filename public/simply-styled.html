<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIMPLY STYLED</title>
<meta name="description" content="A personal stylist for Kuwait. Answer eight short screens, give us your measurements, and a stylist shops Kuwait for a look that fits — delivered to your door.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme:dark)">
<link rel="icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">

<style>
/* ==========================================================================
   SIMPLY STYLED
   International Typographic Style: one grid, one grotesque, one accent.
   Hairline rules do the dividing, negative space does the grouping, and
   nothing is decorative — every red mark means something.
   ========================================================================== */

/* ---------------------------------- tokens -------------------------------- */
:root{
  --bg:#FFFFFF;
  --bg-2:#F4F4F2;
  --bg-3:#E9E9E4;
  --ink:#0B0B0B;
  --ink-2:#43433F;
  --ink-3:#78787A;
  --line:#CFCFC9;
  --hair:#E4E4DF;
  --accent:#E1140A;
  --accent-soft:#FBE8E6;
  --on-accent:#FFFFFF;
  --focus:#0047FF;
  --sans:"Inter","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --ar:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --tap:44px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0B0B;
    --bg-2:#151513;
    --bg-3:#20201D;
    --ink:#F5F5F3;
    --ink-2:#C4C4BF;
    --ink-3:#8C8C87;
    --line:#33332F;
    --hair:#242421;
    --accent:#FF3D2E;
    --accent-soft:#2A100D;
    --on-accent:#0B0B0B;
    --focus:#7FA9FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0B0B;
  --bg-2:#151513;
  --bg-3:#20201D;
  --ink:#F5F5F3;
  --ink-2:#C4C4BF;
  --ink-3:#8C8C87;
  --line:#33332F;
  --hair:#242421;
  --accent:#FF3D2E;
  --accent-soft:#2A100D;
  --on-accent:#0B0B0B;
  --focus:#7FA9FF;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.5;
  font-feature-settings:"cv05","ss01";
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
body[dir="rtl"]{font-family:var(--ar);font-feature-settings:normal}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:var(--accent);color:var(--on-accent)}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;scroll-behavior:auto !important}}

.shell{max-width:1140px;margin:0 auto;padding:0 clamp(16px,4vw,44px)}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{
  position:absolute;inset-inline-start:-9999px;top:0;z-index:9;
  background:var(--ink);color:var(--bg);padding:12px 18px;
  font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
}
.skip:focus{inset-inline-start:0}

/* -------------------------------- masthead -------------------------------- */
.mast{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:18px 0 12px;border-bottom:2px solid var(--ink);
}
.brand{
  font-size:clamp(19px,2.5vw,25px);font-weight:800;letter-spacing:-.025em;
  text-transform:uppercase;line-height:1;margin-inline-end:auto;
  display:flex;align-items:baseline;gap:.12em;direction:ltr;
}
.brand i{font-style:normal;color:var(--accent)}
.mast-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tool{
  font:inherit;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  background:none;border:1px solid var(--line);color:var(--ink-2);
  min-height:34px;padding:0 11px;cursor:pointer;
}
.tool:hover{border-color:var(--ink);color:var(--ink)}
.acct{
  display:flex;align-items:center;gap:8px;border:1px solid var(--line);
  min-height:34px;padding:0 4px 0 0;font-size:11px;font-weight:600;
}
body[dir="rtl"] .acct{padding:0 0 0 4px}
.acct i{
  font-style:normal;background:var(--ink);color:var(--bg);font-weight:800;
  font-size:10.5px;letter-spacing:.04em;padding:0 7px;align-self:stretch;
  display:flex;align-items:center;direction:ltr;
}
.acct em{
  font-style:normal;text-transform:uppercase;letter-spacing:.06em;
  max-width:10ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.acct button{
  font:inherit;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  background:none;border:0;border-inline-start:1px solid var(--line);
  color:var(--ink-3);cursor:pointer;padding:8px 8px;
}
.acct button:hover{color:var(--accent)}

/* -------------------------------- progress -------------------------------- */
.progress{display:none;padding:14px 0 0}
.progress.on{display:block}
.pbar{display:flex;gap:3px;direction:ltr}
.pbar span{flex:1;height:4px;background:var(--bg-3)}
.pbar span.done{background:var(--accent)}
.pbar span.at{background:var(--ink)}
.pmeta{
  display:flex;justify-content:space-between;gap:12px;padding-top:7px;
  font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
}
.pmeta b{color:var(--ink);font-variant-numeric:tabular-nums}
body[dir="rtl"] .pmeta{letter-spacing:.02em}

/* ---------------------------------- sheet --------------------------------- */
.sheet{
  display:grid;grid-template-columns:minmax(150px,2fr) minmax(0,7fr);
  gap:clamp(22px,4.5vw,60px);padding:clamp(26px,5vw,54px) 0 40px;align-items:start;
}
.rail{position:sticky;top:22px}
.stepno{
  font-size:clamp(60px,9vw,110px);font-weight:800;letter-spacing:-.055em;line-height:.78;
  font-variant-numeric:tabular-nums;direction:ltr;
}
.stepno.mark{display:block;height:14px;width:56px;background:var(--accent)}
.railtag{
  font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  margin-top:14px;padding-top:10px;border-top:2px solid var(--ink);
}
body[dir="rtl"] .railtag{letter-spacing:.02em}
.railnote{font-size:12.5px;color:var(--ink-3);margin-top:8px;max-width:26ch}
.jump{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:1px}
.jump li{display:flex}
.jump button{
  font:inherit;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  background:none;border:0;color:var(--ink-3);cursor:pointer;
  padding:5px 0;display:flex;gap:9px;width:100%;text-align:start;align-items:baseline;
}
.jump button var{font-style:normal;font-variant-numeric:tabular-nums;color:var(--line)}
.jump button:hover:not([disabled]){color:var(--accent)}
.jump button[disabled]{cursor:default;color:var(--line)}
.jump li.now button{color:var(--ink);font-weight:700}
.jump li.now button var{color:var(--accent)}
@media (max-width:820px){
  .sheet{grid-template-columns:1fr;gap:0;padding-top:22px}
  .rail{position:static;display:grid;grid-template-columns:auto 1fr;gap:0 16px;align-items:end;margin-bottom:22px}
  .stepno{font-size:52px}
  .railtag{margin:0;border-top:0;padding-top:0;align-self:end;padding-bottom:6px}
  .railnote,.jump{display:none}
}

/* --------------------------------- headings ------------------------------- */
.display{
  font-size:clamp(38px,6.4vw,76px);font-weight:800;letter-spacing:-.035em;line-height:.94;
  margin:0 0 18px;text-wrap:balance;
}
body[dir="rtl"] .display{font-size:clamp(28px,4.6vw,50px);font-weight:700;letter-spacing:0;line-height:1.18}
.qh{
  font-size:clamp(26px,3.4vw,42px);font-weight:700;letter-spacing:-.03em;line-height:1.05;
  margin:0 0 12px;text-wrap:balance;
}
body[dir="rtl"] .qh{font-size:clamp(22px,3vw,32px);letter-spacing:0;line-height:1.3}
.lede{font-size:clamp(15px,1.6vw,18px);color:var(--ink-2);margin:0;max-width:56ch;line-height:1.45}
.note{font-size:13px;color:var(--ink-3);margin:10px 0 0;max-width:62ch}
.note b{color:var(--ink)}

/* ---------------------------------- blocks -------------------------------- */
.block{margin-top:26px;padding-top:22px;border-top:1px solid var(--hair)}
.block.first{margin-top:30px;padding-top:22px;border-top:2px solid var(--ink)}
.lab{
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  font-size:11.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;margin-bottom:12px;
}
body[dir="rtl"] .lab{letter-spacing:.02em}
.lab u{text-decoration:none;color:var(--accent)}
.lab i{font-style:normal;font-weight:500;letter-spacing:.06em;color:var(--ink-3)}
.hint{font-size:12.5px;color:var(--ink-3);margin:10px 0 0;max-width:64ch}
.err{
  font-size:12.5px;font-weight:600;color:var(--accent);margin:10px 0 0;
  border-inline-start:3px solid var(--accent);padding:6px 0 6px 10px;background:var(--accent-soft);
}
body[dir="rtl"] .err{padding:6px 10px 6px 0}
.block[data-missing="1"] .lab{color:var(--accent)}

/* ---------------------------------- options ------------------------------- */
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.opts.tight{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr))}
.opt{
  font:inherit;font-size:14px;font-weight:500;text-align:start;cursor:pointer;
  background:var(--bg);border:1px solid var(--line);color:var(--ink);
  min-height:var(--tap);padding:10px 13px;display:flex;gap:9px;align-items:baseline;
  transition:background .12s linear,border-color .12s linear,color .12s linear;
}
.opt:hover{border-color:var(--ink)}
.opt var{
  font-style:normal;font-size:11px;font-weight:700;color:var(--ink-3);
  flex:none;line-height:1.5;direction:ltr;
}
.opt div{display:grid;gap:2px}
.opt small{font-size:12px;font-weight:400;color:var(--ink-3);line-height:1.3}
.opt[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.opt[aria-checked="true"] var{color:var(--accent)}
.opt[aria-checked="true"] small{color:var(--bg-3)}
.opt.tiny{
  justify-content:center;text-align:center;font-weight:600;
  font-variant-numeric:tabular-nums;padding:10px 8px;
}

/* ------------------------------ tone swatches ----------------------------- */
.tones{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px}
.tone{
  font:inherit;text-align:start;cursor:pointer;color:var(--ink);
  background:var(--bg);border:1px solid var(--line);padding:0 0 12px;
}
.tone:hover{border-color:var(--ink)}
.tone[aria-checked="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.tone .sw{display:flex;height:52px}
.tone .sw i{flex:1}
.tone b{display:flex;gap:8px;align-items:baseline;font-size:14px;font-weight:600;padding:11px 12px 3px}
.tone b var{font-style:normal;font-size:11px;font-weight:700;color:var(--ink-3);direction:ltr}
.tone[aria-checked="true"] b var{color:var(--accent)}
.tone em{font-style:normal;font-size:12px;color:var(--ink-3);display:block;padding:0 12px;line-height:1.35}

/* ---------------------------------- inputs -------------------------------- */
input[type=text],input[type=email],input[type=tel]{
  font:inherit;font-size:16px;width:100%;padding:12px 13px;color:var(--ink);
  background:var(--bg-2);border:1px solid var(--line);border-radius:0;min-height:var(--tap);
}
input::placeholder{color:var(--ink-3)}
input:focus-visible{outline:2px solid var(--focus);outline-offset:0;border-color:var(--focus)}
input[aria-invalid="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tel{display:flex;align-items:stretch}
.tel span{
  display:flex;align-items:center;padding:0 12px;background:var(--ink);color:var(--bg);
  font-size:13px;font-weight:700;letter-spacing:.06em;border:1px solid var(--ink);
  border-inline-end:0;direction:ltr;
}
.tel input{font-variant-numeric:tabular-nums;letter-spacing:.06em}

/* ------------------------------ measurements ------------------------------ */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px}
.mrow .mfield{position:relative;display:block}
.mrow label{
  display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-2);margin-bottom:6px;
}
body[dir="rtl"] .mrow label{letter-spacing:.02em}
.mrow em{
  position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);
  font-style:normal;font-size:12px;font-weight:600;color:var(--ink-3);pointer-events:none;
}
.mrow input{padding-inline-end:38px;font-variant-numeric:tabular-nums}
.mrow small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.3}
.mrow small.bad{color:var(--accent);font-weight:600}
.mrow[data-filled="1"] label{color:var(--ink)}
.mrow[data-filled="1"] label::after{content:" ●";color:var(--accent);font-size:9px;vertical-align:1px}

.meter{border:2px solid var(--ink);padding:14px 15px;margin-bottom:20px;background:var(--bg-2)}
.meter .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.meter .top b{font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}
body[dir="rtl"] .meter .top b{letter-spacing:.02em}
.meter .top span{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);direction:ltr}
.meter .segs{display:flex;gap:3px;margin:10px 0 0;direction:ltr}
.meter .segs i{flex:1;height:8px;background:var(--line)}
.meter .segs i.on{background:var(--accent)}
.meter p{margin:9px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.4}
.meter p b{color:var(--ink)}

.why{list-style:none;margin:0 0 22px;padding:0;display:grid;gap:1px;border-top:1px solid var(--hair)}
.why li{
  display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline;
  padding:11px 0;border-bottom:1px solid var(--hair);font-size:13.5px;
}
.why li b{
  font-size:11px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;direction:ltr;
}
.why li span{color:var(--ink-2)}
.why li span strong{color:var(--ink);font-weight:600}

.howto{margin-top:14px;border-top:1px solid var(--hair);padding-top:12px}
.howto summary{
  font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;color:var(--ink-2);min-height:28px;
}
body[dir="rtl"] .howto summary{letter-spacing:.02em}
.howto summary:hover{color:var(--ink)}
.howto ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:7px;font-size:12.5px;color:var(--ink-3)}
.howto li{display:grid;grid-template-columns:auto 1fr;gap:9px}
.howto li b{color:var(--ink-2);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase}

/* ---------------------------------- actions ------------------------------- */
.actions{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  margin-top:30px;padding-top:18px;border-top:2px solid var(--ink);
}
.btn{
  font:inherit;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
  background:var(--ink);color:var(--bg);border:1px solid var(--ink);
  min-height:52px;padding:0 30px;display:inline-flex;align-items:center;gap:10px;
  text-decoration:none;
  transition:background .12s linear,border-color .12s linear;
}
.btn:hover{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.wide{width:100%;justify-content:center}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.doors .btn{justify-content:center;text-align:center;padding:0 18px}
@media (max-width:560px){.doors{grid-template-columns:1fr}}
.btn.quiet{background:none;color:var(--ink);border-color:var(--line)}
.btn.quiet:hover{background:none;border-color:var(--ink);color:var(--ink)}
.btn var{font-style:normal;font-variant-numeric:tabular-nums;direction:ltr}
.back{
  font:inherit;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  background:none;border:0;color:var(--ink-3);cursor:pointer;
  min-height:var(--tap);padding:0 2px;margin-inline-end:auto;
}
.back:hover{color:var(--accent)}
body[dir="rtl"] .back{margin-inline-end:auto}
@media (max-width:640px){
  .actions{
    position:sticky;bottom:0;z-index:5;background:var(--bg);
    margin-inline:calc(clamp(16px,4vw,44px) * -1);padding:12px clamp(16px,4vw,44px);
    border-top:2px solid var(--ink);
  }
  .btn{flex:1;justify-content:center;padding:0 16px}
  .back{margin-inline-end:0}
}

/* --------------------------------- landing -------------------------------- */
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px}
.tag{
  font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-2);border:1px solid var(--line);padding:6px 10px;
}
body[dir="rtl"] .tag{letter-spacing:.02em}
.priceline{
  display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;
  margin-top:26px;padding-top:18px;border-top:2px solid var(--ink);
}
.priceline b{
  font-size:clamp(44px,7vw,84px);font-weight:800;letter-spacing:-.05em;line-height:.82;
  font-variant-numeric:tabular-nums;direction:ltr;
}
.priceline span{
  font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);padding-bottom:6px;max-width:16ch;
}
body[dir="rtl"] .priceline b{font-size:clamp(30px,4.6vw,52px);letter-spacing:0}
body[dir="rtl"] .priceline span{letter-spacing:.02em}
.steps{list-style:none;margin:24px 0 0;padding:0;display:grid;gap:0;border-top:1px solid var(--hair)}
.steps li{
  display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:baseline;
  padding:14px 0;border-bottom:1px solid var(--hair);
}
.steps li b{font-size:12px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;direction:ltr}
.steps li strong{font-weight:600;font-size:15px;display:block}
.steps li em{font-style:normal;color:var(--ink-3);font-size:13px;display:block;margin-top:2px}

/* --------------------------------- profile -------------------------------- */
.rsw{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.rsw i{display:block;height:64px;border:1px solid var(--hair)}
.rsw span{
  font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-3);display:block;margin-top:6px;line-height:1.25;
}
body[dir="rtl"] .rsw span{letter-spacing:.02em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0}
.two>*+*{border-inline-start:1px solid var(--hair)}
@media (max-width:620px){.two{grid-template-columns:1fr}.two>*+*{border-inline-start:0;border-top:1px solid var(--hair)}}
.box{padding:0 16px 4px}
.box:first-child{padding-inline-start:0}
.box:last-child{padding-inline-end:0}
.box h3{
  font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;margin:0 0 10px;
  padding-bottom:8px;border-bottom:2px solid var(--ink);
}
body[dir="rtl"] .box h3{letter-spacing:.02em}
.box.no h3{color:var(--accent);border-color:var(--accent)}
.box ul{margin:0;padding:0;list-style:none;font-size:13.5px;display:grid;gap:8px}
.box li{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:baseline}
.box li::before{content:"+";color:var(--ink);font-weight:700;font-size:12px}
.box.no li::before{content:"–";color:var(--accent)}
.box li span::first-letter{text-transform:uppercase}
.readout{display:grid;gap:0;border-top:1px solid var(--hair)}
.readout div{
  display:grid;grid-template-columns:minmax(96px,1fr) 3fr;gap:14px;
  padding:11px 0;border-bottom:1px solid var(--hair);font-size:13.5px;
}
.readout dt{
  color:var(--ink-3);font-size:10.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;padding-top:3px;
}
body[dir="rtl"] .readout dt{letter-spacing:.02em}
.readout dd{margin:0;font-weight:500}
.readout dd b{font-weight:700}

/* ---------------------------------- money --------------------------------- */
.summary{border-top:2px solid var(--ink)}
.row{
  display:flex;justify-content:space-between;gap:14px;padding:12px 0;
  border-bottom:1px solid var(--hair);font-size:14px;
}
.row span:last-child{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}

/* ==========================================================================
   Answer bookkeeping
   ========================================================================== */
function who(){return A.who||"women";}
function activeFields(step){return step.fields.filter(function(f){return !f.only||f.only===who();});}
function fieldReady(f){
  if(f.type==="text"||f.opt) return true;
  if(f.type==="many") return (A[f.key]||[]).length>0;
  return !!A[f.key];
}
function visibleFields(step){
  return activeFields(step).filter(function(f){return !f.needs||A[f.needs];});
}
function stepReady(step){
  if(step.measure) return true;              /* measurements are never a gate */
  return visibleFields(step).every(fieldReady);
}
function stepTouched(i){
  var step=Q[i];
  if(step.measure) return exactFilled()>0||!!A.__noTape;
  return visibleFields(step).some(function(f){
    return f.type==="many"?(A[f.key]||[]).length>0:!!A[f.key];
  });
}
function firstIncomplete(step){
  var out=null;
  visibleFields(step).forEach(function(f){if(!out&&!fieldReady(f))out=f;});
  return out;
}
function lastPickable(step){
  var vis=visibleFields(step),f=vis[vis.length-1];
  return (f&&f.type==="one"&&!f.bare)?f:null;
}

/* ==========================================================================
   Navigation. Every screen is a history entry, so the browser and the phone
   back gesture do what people expect instead of leaving the site.
   ========================================================================== */
function routeOf(){
  if(view==="quiz") return "#/step/"+(qi+1);
  return "#/"+view;
}
function goto(v,i,replace){
  view=v;
  if(i!=null) qi=Math.max(0,Math.min(Q.length-1,i));
  errs={};
  save();
  try{
    var st={view:view,qi:qi};
    if(replace) history.replaceState(st,"",routeOf());
    else history.pushState(st,"",routeOf());
  }catch(e){}
  render(true);
}
window.onpopstate=function(e){
  var st=e.state;
  if(st&&st.view){
    view=st.view;qi=st.qi||0;
    if(view!=="login"&&!signedIn()) view="login";
    errs={};save();render(true);
  }
};

/* Arrows follow the reading direction, so "forward" points forward in both. */
function fwdArrow(){return lang==="ar"?"←":"→";}
function backArrow(){return lang==="ar"?"→":"←";}

function announce(msg){
  var l=document.getElementById("live");
  if(l) l.textContent=msg||"";
}

/* Arrow keys move through a set of options the way a radio group should. */
function arrowNav(group){
  group.onkeydown=function(e){
    var keys=["ArrowRight","ArrowLeft","ArrowDown","ArrowUp"];
    if(keys.indexOf(e.key)<0) return;
    var items=[].slice.call(group.querySelectorAll('[role="radio"],[role="checkbox"]'));
    var at=items.indexOf(document.activeElement);
    if(at<0) return;
    e.preventDefault();
    var fwd=(e.key==="ArrowDown")||(e.key===(document.body.dir==="rtl"?"ArrowLeft":"ArrowRight"));
    var next=items[(at+(fwd?1:-1)+items.length)%items.length];
    next.focus();
  };
}

function effectiveDark(){
  if(theme) return theme==="dark";
  return !!(window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches);
}
function paintChrome(){
  document.body.setAttribute("dir",lang==="ar"?"rtl":"ltr");
  document.body.lang=lang;
  document.documentElement.lang=lang;
  if(theme) document.documentElement.setAttribute("data-theme",theme);
  else document.documentElement.removeAttribute("data-theme");

  document.getElementById("skip").textContent=t(UI.skip);
  document.getElementById("lang").textContent=lang==="ar"?"English":"العربية";
  var th=document.getElementById("theme");
  th.textContent=effectiveDark()?t(UI.themeLight):t(UI.themeDark);
  th.setAttribute("aria-label",effectiveDark()?t(UI.themeLight):t(UI.themeDark));
  document.getElementById("footL").textContent=t(UI.footer);
  document.getElementById("footR").textContent=lang==="ar"?"الكويت":"KUWAIT";

  var acct=document.getElementById("acct");
  acct.innerHTML="";
  var show=(view!=="login")&&signedIn();
  acct.hidden=!show;
  if(show){
    acct.appendChild(el("i",null,initials()));
    acct.appendChild(el("em",null,firstName()));
    var so=el("button",null,t(UI.signout));so.type="button";
    so.onclick=function(){
      if(serverSession){
        /* End the session on the server too, or the next visit signs
           straight back in and "log out" was a lie. */
        try{
          fetch("/api/signout",{method:"POST",credentials:"same-origin"})
            .catch(function(){})
            .then(function(){serverSession=false;wipe();goto("login",0);});
          return;
        }catch(e){}
      }
      wipe();goto("login",0);
    };
    acct.appendChild(so);
  }

  var pr=document.getElementById("progress");
  pr.innerHTML="";
  pr.className=(view==="quiz")?"progress on":"progress";
  if(view==="quiz"){
    var bar=el("div","pbar");
    Q.forEach(function(s,i){
      var seg=el("span",i<qi?"done":(i===qi?"at":""));
      bar.appendChild(seg);
    });
    pr.appendChild(bar);
    var meta=el("div","pmeta");
    var left=el("span");
    left.appendChild(el("b",null,(qi+1)+" / "+Q.length));
    left.appendChild(document.createTextNode(" · "+t(Q[qi].tag)));

/* A sheet is the two-column grid: number and label on the rail, content on
   the right. It is the only layout in the product. */
function sheet(num,tag,note,withJump){
  var root=el("div","sheet");
  var rail=el("div","rail");
  var no=el("div",num?"stepno":"stepno mark");
  if(num) no.appendChild(document.createTextNode(num));
  rail.appendChild(no);
  rail.appendChild(el("div","railtag",tag||""));
  if(note) rail.appendChild(el("p","railnote",note));
  if(withJump){
    var ul=el("ul","jump");
    Q.forEach(function(s,i){
      var li=el("li",i===qi?"now":null);
      var b=el("button");b.type="button";
      b.appendChild(el("var",null,(i+1<10?"0":"")+(i+1)));
      b.appendChild(document.createTextNode(t(s.tag)));
      var reachable=(i<=qi)||stepTouched(i);
      if(!reachable) b.disabled=true;
      else b.onclick=function(){goto("quiz",i);};
      li.appendChild(b);ul.appendChild(li);
    });
    rail.appendChild(ul);
  }
  var body=el("div","body");
  root.appendChild(rail);root.appendChild(body);
  root.body=body;
  return root;
}

function render(moved){
  paintChrome();
  var main=document.getElementById("main");
  main.innerHTML="";
  var v = view==="login"?login():
          view==="landing"?landing():
          view==="quiz"?(Q[qi].measure?measure():quiz()):
          view==="profile"?profile():
          view==="pay"?pay():done();
  main.appendChild(v);
  if(moved){
    window.scrollTo(0,0);
    /* Move focus to the new screen — but not on the first paint, where it
       would step over the skip link. */
    if(booted) main.focus({preventScroll:true});
    booted=true;
    if(view==="quiz") announce(t(UI.step)+" "+(qi+1)+" "+t(UI.of)+" "+Q.length+" — "+t(Q[qi].q));
  }
}

function optionGroup(f,idBase){
  var many=f.type==="many";
  var group=el("div","opts"+(f.grid?" grid":"")+(f.bare?" tight":""));
  group.setAttribute("role",many?"group":"radiogroup");
  group.setAttribute("aria-labelledby",idBase);
  f.opts.forEach(function(o){
    var on=many?(A[f.key]||[]).indexOf(o[0])>-1:A[f.key]===o[0];
    var b=el("button","opt"+(f.bare?" tiny":""));
    b.type="button";
    b.setAttribute("role",many?"checkbox":"radio");
    b.setAttribute("aria-checked",on?"true":"false");
    if(!many) b.tabIndex=(on||(!A[f.key]&&o===f.opts[0]))?0:-1;
    if(!f.bare) b.appendChild(el("var",null,many?(on?"[×]":"[ ]"):(on?"(●)":"( )")));
    var wrap=el("div");
    wrap.appendChild(el("span",null,typeof o[1]==="string"?o[1]:t(o[1])));
    if(o[2]) wrap.appendChild(el("small",null,t(o[2])));
    b.appendChild(wrap);
    b.onclick=function(){
      errs[f.key]=false;
      if(many){
        var arr=(A[f.key]||[]).slice(),ix=arr.indexOf(o[0]);
        var solo=(o[0]==="nolayer"||o[0]==="nothing");
        if(solo){ arr=ix>-1?[]:[o[0]]; }
        else{
          if(ix>-1) arr.splice(ix,1); else arr.push(o[0]);
          arr=arr.filter(function(v){return v!=="nolayer"&&v!=="nothing";});
        }
        A[f.key]=arr;save();render();
      }else{
        A[f.key]=o[0];save();
        var step=Q[qi];
        /* Answering the last open question of a screen moves on by itself —
           one tap saved per screen, and never a surprise, because the screen
           is finished. */
        if(f===lastPickable(step)&&qi<Q.length-1&&stepReady(step)){
          announce(t(UI.next));
          goto("quiz",qi+1);
        }else{
          render();
        }
      }
    };
    group.appendChild(b);
  });
  if(!many) arrowNav(group);
  return group;
}

function toneGroup(f,idBase){
  var group=el("div","tones");
  group.setAttribute("role","radiogroup");

}

function quiz(){
  var step=Q[qi];
  var s=sheet((qi+1<10?"0":"")+(qi+1),t(step.tag),t(step.note),true),p=s.body;
  var first=true;

  p.appendChild(el("h2","qh",t(step.q)));
  p.appendChild(el("p","lede",t(step.sub)));

  visibleFields(step).forEach(function(f){
    var wrap=el("div","block"+(first?" first":""));first=false;
    if(errs[f.key]) wrap.setAttribute("data-missing","1");
    var idBase="lab-"+step.id+"-"+f.key;

    var lab=el("span","lab");lab.id=idBase;
    lab.appendChild(document.createTextNode(t(f.label)));
    if(f.opt||f.type==="text") lab.appendChild(el("i",null,t(UI.optional)));
    else lab.appendChild(el("u",null,"*"));
    wrap.appendChild(lab);

    if(f.type==="text"){
      var inp=document.createElement("input");inp.type="text";
      inp.placeholder=t(f.ph);inp.value=A[f.key]||"";
      inp.setAttribute("aria-labelledby",idBase);
      inp.oninput=function(){A[f.key]=inp.value;save();};
      wrap.appendChild(inp);
      if(f.hint) wrap.appendChild(el("p","hint",t(f.hint)));
    }else if(f.type==="tone"){
      wrap.appendChild(toneGroup(f,idBase));
    }else{
      wrap.appendChild(optionGroup(f,idBase));
    }
    if(errs[f.key]) wrap.appendChild(el("p","err",t(UI.missing)));
    p.appendChild(wrap);
  });

  if(qi===Q.length-1){
    var mb=el("div","block");
    mb.appendChild(orderSummary(false));
    p.appendChild(mb);
  }

  var nav=el("div","actions");
  var back=el("button","back",backArrow()+" "+t(UI.back));back.type="button";
  back.onclick=function(){ if(qi===0) goto("landing",0); else goto("quiz",qi-1); };
  nav.appendChild(back);

  var last=(qi===Q.length-1);
  var nx=el("button","btn",(last?t(UI.prGo):t(UI.next))+" "+fwdArrow());nx.type="button";
  nx.onclick=function(){
    if(!stepReady(step)){
      /* Never a dead disabled button: say what is missing and go there. */
      visibleFields(step).forEach(function(f){ if(!fieldReady(f)) errs[f.key]=true; });
      var target=firstIncomplete(step);
      render();
      var node=document.querySelector('[data-missing="1"]');
      if(node){
        var focusable=node.querySelector('input,[role="radio"],[role="checkbox"]');
        (focusable||node).scrollIntoView({block:"center",behavior:"smooth"});
        if(focusable) focusable.focus({preventScroll:true});
      }
      announce(t(UI.pick)+(target?" "+t(target.label):""));
      return;
    }
    if(last) goto("profile",qi); else goto("quiz",qi+1);
  };
  nav.appendChild(nx);
  p.appendChild(nav);
  return s;
}

/* ==========================================================================
   Measurements — a screen of its own, and the one that decides the fit
   ========================================================================== */
function measure(){
  var step=Q[qi];
  var s=sheet((qi+1<10?"0":"")+(qi+1),t(step.tag),t(step.note),true),p=s.body;
  var fields=exactFields(),filled=exactFilled(),acc=accuracy();

  p.appendChild(el("h2","qh",t(step.q)));
  p.appendChild(el("p","lede",t(step.sub)));

  /* Why it matters, before the fields rather than as a footnote after them. */
  var why=el("ul","why");why.style.marginTop="26px";
  [[UI.mWhy1,UI.mWhy1b],[UI.mWhy2,UI.mWhy2b],[UI.mWhy3,UI.mWhy3b]].forEach(function(x,i){
    var li=el("li");
    li.appendChild(el("b",null,"0"+(i+1)));
    var sp=el("span");
    sp.appendChild(el("strong",null,t(x[0])+" "));
    sp.appendChild(document.createTextNode(t(x[1])));
    li.appendChild(sp);why.appendChild(li);
  });
  p.appendChild(why);

  /* The meter is the point of the screen: progress you can see. */
  var mt=el("div","meter");
  var top=el("div","top");
  top.appendChild(el("b",null,t(UI.mAcc)));
  top.appendChild(el("span",null,A.__noTape?"0 / "+fields.length:filled+" / "+fields.length));
  mt.appendChild(top);
  var segs=el("div","segs");
  fields.forEach(function(m,i){segs.appendChild(el("i",(!A.__noTape&&i<filled)?"on":null));});
  mt.appendChild(segs);
  var mp=el("p");
  mp.appendChild(el("b",null,[t(UI.mAcc0),t(UI.mAcc1),t(UI.mAcc2),t(UI.mAcc3)][acc].split(".")[0]+". "));
  mp.appendChild(document.createTextNode(t(accuracyCopy()).split(". ").slice(1).join(". ")));
  mt.appendChild(mp);
  p.appendChild(mt);

  if(A.__noTape){
    p.appendChild(el("p","note",t(UI.mSkipOn)));
    var undo=el("button","btn quiet",t(UI.mSkipUndo));undo.type="button";
    undo.style.marginTop="14px";
    undo.onclick=function(){A.__noTape=false;save();render();announce(t(UI.mAcc));};
    p.appendChild(undo);
  }else{
    var grid=el("div","mgrid");
    fields.forEach(function(m){
      var key=m[0],val=A[key]||"",bad=outOfRange(m,val);
      var row=el("div","mrow");
      if(inRange(m,val)) row.setAttribute("data-filled","1");
      var id="m-"+key;
      var lb=document.createElement("label");lb.htmlFor=id;lb.textContent=t(m[1]);
      var inp=document.createElement("input");
      inp.type="text";inp.id=id;inp.value=val;inp.dir="ltr";
      inp.placeholder="—";
      inp.setAttribute("inputmode","decimal");
      inp.setAttribute("autocomplete","off");
      if(bad) inp.setAttribute("aria-invalid","true");
      inp.oninput=function(){
        A[key]=inp.value.replace(/[^\d.]/g,"").slice(0,6);
        if(inp.value!==A[key]) inp.value=A[key];
        save();
        /* Repaint only the meter and this row, so the caret never moves. */
        paintMeter(mt,fields);
        row.setAttribute("data-filled",inRange(m,A[key])?"1":"0");
        var msg=row.querySelector("small");
        var isBad=outOfRange(m,A[key]);
        if(msg){
          msg.className=isBad?"bad":"";
          msg.textContent=isBad?t(UI.mOdd):t(m[5]);
        }
        if(isBad) inp.setAttribute("aria-invalid","true"); else inp.removeAttribute("aria-invalid");
      };
      var field=el("span","mfield");
      field.appendChild(inp);
      field.appendChild(el("em",null,t(UI.cm)));
      row.appendChild(lb);row.appendChild(field);
      row.appendChild(el("small",bad?"bad":null,bad?t(UI.mOdd):t(m[5])));
      grid.appendChild(row);
    });
    p.appendChild(grid);

    var how=document.createElement("details");how.className="howto";
    var sum=document.createElement("summary");sum.textContent=t(UI.mHow);
    how.appendChild(sum);
    var hl=el("ul");
    [[UI.mHowTape,UI.mHowTapeD],[UI.mHowWear,UI.mHowWearD],
     [UI.mHowStand,UI.mHowStandD],[UI.mHowHelp,UI.mHowHelpD]].forEach(function(x){
      var li=el("li");
      li.appendChild(el("b",null,t(x[0])));
      li.appendChild(el("span",null,t(x[1])));
      hl.appendChild(li);
    });
    how.appendChild(hl);
    p.appendChild(how);

    var skip=el("button","btn quiet",t(UI.mSkip));skip.type="button";
    skip.style.marginTop="16px";
    skip.onclick=function(){
      A.__noTape=true;
      fields.forEach(function(m){delete A[m[0]];});
      save();render();announce(t(UI.mSkipOn));
    };
    p.appendChild(skip);
  }

  var nav=el("div","actions");
  var back=el("button","back",backArrow()+" "+t(UI.back));back.type="button";
  back.onclick=function(){goto("quiz",qi-1);};
  nav.appendChild(back);
  var nx=el("button","btn",t(UI.next)+" "+fwdArrow());nx.type="button";
  nx.onclick=function(){goto("quiz",qi+1);};
  nav.appendChild(nx);
  p.appendChild(nav);
  return s;
}
function paintMeter(mt,fields){
  var filled=exactFilled(),acc=accuracy();
  mt.querySelector(".top span").textContent=filled+" / "+fields.length;
  [].slice.call(mt.querySelectorAll(".segs i")).forEach(function(seg,i){
    seg.className=i<filled?"on":"";

  mp.innerHTML="";
  var full=t(accuracyCopy());
  mp.appendChild(el("b",null,full.split(".")[0]+". "));
  mp.appendChild(document.createTextNode(full.split(". ").slice(1).join(". ")));
}

  var SW={hourglass:{en:"Waist narrowest",ar:"الوسط الأنحف"},pear:{en:"Hips widest",ar:"الأرداف الأعرض"},

  var SM={slim:{en:"Slim",ar:"نحيف"},athletic:{en:"Athletic",ar:"رياضي"},average:{en:"Average",ar:"متوسط"},

  var shp=w==="women"?(A.shapeW&&t(SW[A.shapeW])):(A.shapeM&&t(SM[A.shapeM]));

function silhouette(){
  var parts=[];
  var SH={narrow:{en:"soft shoulder seams and no padding, so nothing hangs past your frame",ar:"خياطة كتف ناعمة بلا حشوة، حتى لا يتجاوز شيء بنيتك"},
          average:{en:"standard shoulder seams, which land where they should on you",ar:"خياطة كتف عادية تقع في مكانها الصحيح عليك"},
          broad:{en:"raglan and dropped shoulders instead of set-in seams, so nothing pulls across the back",ar:"أكمام راجلان ومسدلة بدل المبطنة، حتى لا يشد شيء على الظهر"}};
  var AM={short:{en:"sleeves ordered short or turned up at the cuff",ar:"أكمام قصيرة أو مثنية عند الأسوار"},
          average:{en:"standard sleeve lengths",ar:"أطوال أكمام عادية"},
          long:{en:"long-sleeve cuts and shirts with real cuff length",ar:"قَصّات طويلة الأكمام مع طول أسوار حقيقي"}};
  var TO={short:{en:"high-waisted bottoms to use the leg line you have",ar:"بنطلونات عالية الوسط لاستثمار خط ساقك"},
          average:{en:"waistlines where the garment intends them",ar:"خطوط وسط في موضعها الطبيعي"},
          long:{en:"lower waistlines and tops long enough to stay put",ar:"خطوط وسط أخفض وبلوزات أطول تبقى في مكانها"}};
  var SP={hourglass:{en:"Cuts that follow the waist rather than hide it",ar:"قَصّات تتبع الوسط بدل إخفائه"},
          pear:{en:"Structure and interest on top, clean lines below",ar:"بنية وتفاصيل في الأعلى وخطوط نظيفة في الأسفل"},
          rectangle:{en:"Belts, wrap fronts and seams that create a waist",ar:"أحزمة وقَصّات ملفوفة وخياطة تصنع وسطاً"},
          apple:{en:"Vertical lines and pieces that skim rather than cling",ar:"خطوط عمودية وقطع تنسدل بلا التصاق"},
          inverted:{en:"Volume moved to the lower half to balance the shoulder",ar:"نقل الحجم للنصف الأسفل لموازنة الكتف"},
          unsure:{en:"A first look that plays safe, then we learn from your feedback",ar:"إطلالة أولى آمنة، ثم نتعلم من ملاحظاتك"}};
  var SM={slim:{en:"Layers and structure to add weight to the frame",ar:"طبقات وبنية لإضافة حجم للبنية"},
          athletic:{en:"Tapered cuts that follow the shoulder-to-waist line",ar:"قَصّات مضيّقة تتبع خط الكتف للوسط"},
          average:{en:"Standard cuts, tailored at the waist",ar:"قَصّات عادية معدّلة عند الوسط"},
          broad:{en:"Straight cuts in fabric with body, nothing clingy",ar:"قَصّات مستقيمة بقماش له قوام، بلا التصاق"},
          unsure:{en:"A first look that plays safe, then we learn from your feedback",ar:"إطلالة أولى آمنة، ثم نتعلم من ملاحظاتك"}};

  var head = who()==="women" ? (A.shapeW&&t(SP[A.shapeW])) : (A.shapeM&&t(SM[A.shapeM]));
  if(head) parts.push(head);
  var det=[];
  if(A.shoulders) det.push(t(SH[A.shoulders]));
  if(A.arms) det.push(t(AM[A.arms]));
  if(A.torso) det.push(t(TO[A.torso]));
  var FP={fitted:{en:"a close cut",ar:"قَصّة ضيّقة"},
          true:{en:"a true-to-size cut",ar:"قَصّة على المقاس"},
          relaxed:{en:"an easy cut with structure at the shoulder",ar:"قَصّة مريحة مع بنية عند الكتف"},
          oversized:{en:"volume on top and narrow below",ar:"حجم في الأعلى وضيق في الأسفل"}};
  if(A.fitpref) det.unshift(t(FP[A.fitpref]));
  var CV={arms:{en:"covered arms",ar:"ذراعان مغطاتان"},waist:{en:"a skimming waist",ar:"وسط منسدل"},
          legs:{en:"longer lengths",ar:"أطوال أطول"},shoulders:{en:"soft shoulders",ar:"أكتاف ناعمة"},
          chest:{en:"higher necklines",ar:"فتحات رقبة مرتفعة"},back:{en:"a closed back",ar:"ظهر مغلق"}};
  (A.cover||[]).forEach(function(k){if(CV[k])det.push(t(CV[k]));});
  det=det.slice(0,3);
  var s=(parts.length?parts[0]+". ":"");
  if(det.length){
    var joined = det.length>1
      ? det.slice(0,-1).join(lang==="ar"?"، ":", ")+(lang==="ar"?" و":" and ")+det[det.length-1]
      : det[0];
    s+=(lang==="ar"?"مع ":"With ")+joined+". ";
  }
  /* Measured numbers change what we can promise, so they get said out loud. */
  if(accuracy()===3) s+=(lang==="ar"
    ?"ومقاساتك الكاملة محفوظة، لذا تُشترى كل قطعة على أرقامك. "
    :"Your full measurements are on file, so every piece is bought to your numbers. ");
  var B={quiet:{en:"The loudest thing on you will be the fit.",ar:"أبرز شيء فيك سيكون دقة المقاس."},
         polished:{en:"One considered detail carries the look — a shoe, a belt, a sleeve.",ar:"تفصيلة واحدة مدروسة تحمل الإطلالة — حذاء، حزام، أو كم."},
         statement:{en:"One piece does the talking; everything around it stays quiet.",ar:"قطعة واحدة تتحدث، وكل ما حولها هادئ."}};
  if(A.bold) s+=t(B[A.bold]);

  return out.slice(0,5);

function phoneDigits(){return (A.phone||"").replace(/\D/g,"").slice(0,8);}
function phoneOk(){var d=phoneDigits();return d.length===8&&/^[569]/.test(d);}
function phonePretty(d){return d.length>4?d.slice(0,4)+" "+d.slice(4):d;}

function pay(){
  var m=money();
  var s=sheet(null,t(UI.payTag),null),p=s.body;
  p.appendChild(el("h2","qh",t(UI.payH)));
  p.appendChild(el("p","lede",t(UI.demo)));

  var f0=el("div","block first");
  var sum=el("div","summary");
  sum.appendChild(row(t(UI.acct),firstName(),U.email));
  sum.appendChild(row(t(UI.rStyle)+" × "+m.looks,cur(m.styling)));
  sum.appendChild(row(t(UI.rBudget)+" × "+m.looks,cur(m.clothes),t(UI.rBudgetE)));
  sum.appendChild(row(t(UI.rShip),m.ship?cur(m.ship):t(UI.free),t(UI.tShip)));
  var tt=row(t(UI.rTotal),cur(m.total));tt.className="row total";
  sum.appendChild(tt);
  f0.appendChild(sum);p.appendChild(f0);

  /* phone */
  var pf=el("div","block");
  if(errs.phone) pf.setAttribute("data-missing","1");
  var pl=el("span","lab");pl.id="lab-phone";
  pl.appendChild(document.createTextNode(t(UI.phone)));
  pl.appendChild(el("u",null,"*"));
  pf.appendChild(pl);
  var tel=el("div","tel");
  tel.appendChild(el("span",null,"+965"));
  var inp=document.createElement("input");
  inp.type="tel";inp.placeholder=t(UI.phoneP);inp.value=phonePretty(phoneDigits());
  inp.dir="ltr";inp.setAttribute("inputmode","tel");inp.autocomplete="tel-national";
  inp.setAttribute("aria-labelledby","lab-phone");
  if(errs.phone) inp.setAttribute("aria-invalid","true");
  inp.oninput=function(){
    var d=inp.value.replace(/\D/g,"").slice(0,8);
    A.phone=d;save();
    inp.value=phonePretty(d);
    if(errs.phone&&phoneOk()){errs.phone=false;inp.removeAttribute("aria-invalid");
      var e2=pf.querySelector(".err");if(e2)e2.remove();pf.removeAttribute("data-missing");}
  };
  tel.appendChild(inp);
  pf.appendChild(tel);
  if(errs.phone) pf.appendChild(el("p","err",t(UI.phoneBad)));
  pf.appendChild(el("p","hint",t(UI.phoneH)));
  p.appendChild(pf);

  /* method */
  var mf=el("div","block");
  if(errs.method) mf.setAttribute("data-missing","1");
  var ml=el("span","lab");ml.id="lab-method";
  ml.appendChild(document.createTextNode(t(UI.payWith)));
  ml.appendChild(el("u",null,"*"));
  mf.appendChild(ml);
  var box=el("div","paylist");
  box.setAttribute("role","radiogroup");
  box.setAttribute("aria-labelledby","lab-method");
  [["knet",UI.knet,"KNET",UI.knetE],
   ["apple",UI.apay,"PAY",null],
   ["card",UI.card,"VISA",null],
   ["tabby",UI.tabby,"TABBY",{en:kd(m.total/4)+" KD × 4",ar:"٤ × "+kd(m.total/4)+" د.ك"}]].forEach(function(mm){
    var on=A.method===mm[0];
    var b=el("button","paybtn");b.type="button";
    b.setAttribute("role","radio");
    b.setAttribute("aria-checked",on?"true":"false");
    b.tabIndex=(on||(!A.method&&mm[0]==="knet"))?0:-1;
    b.appendChild(el("u",null,mm[2]));
    b.appendChild(el("span",null,t(mm[1])));
    if(mm[3]) b.appendChild(el("em",null,t(mm[3])));
    b.onclick=function(){errs.method=false;A.method=mm[0];save();render();};
    box.appendChild(b);
  });
  arrowNav(box);
  mf.appendChild(box);
  if(errs.method) mf.appendChild(el("p","err",t(UI.payPick)));
  p.appendChild(mf);

  /* terms — the sizing line depends on whether we have the measurements */
  var terms=el("div","terms");
  [[UI.tShip,UI.tShipD],
   [UI.tSize,accuracy()===3?UI.tSizeOne:UI.tSizeTwo],
   [UI.tRet,UI.tRetD]].forEach(function(x){
    var r2=el("p");
    r2.appendChild(el("b",null,t(x[0])));
    r2.appendChild(el("span",null,t(x[1])));
    terms.appendChild(r2);
  });
  p.appendChild(terms);

  var nav=el("div","actions");
  var back=el("button","back",backArrow()+" "+t(UI.back));back.type="button";
  back.onclick=function(){goto("profile",qi);};
  nav.appendChild(back);
  var go=el("button","btn");go.type="button";
  go.appendChild(document.createTextNode(t(UI.payBtn)+" "));
  go.appendChild(el("var",null,cur(m.total)));
  go.onclick=function(){
    if(!A.method||!phoneOk()){
      errs.method=!A.method;errs.phone=!phoneOk();
      render();
      var node=document.querySelector('[data-missing="1"]');
      if(node){
        var f=node.querySelector('input,[role="radio"]');
        (f||node).scrollIntoView({block:"center",behavior:"smooth"});
        if(f) f.focus({preventScroll:true});
      }
      announce(errs.phone?t(UI.phoneBad):t(UI.payPick));
      return;
    }
    goto("done",qi);
  };
  nav.appendChild(go);
  p.appendChild(nav);
  return s;
}

/**
 * The page is static HTML, so it cannot read the session cookie — it asks.
 * A signed-in customer skips the front screen and gets their name back; a
 * failure here is silent, because the guest path must keep working whether
 * or not there is a database behind the site.
 */
function checkSession(){
  if(!window.fetch) return;
  fetch("/api/me",{credentials:"same-origin",headers:{accept:"application/json"}})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(d){
      if(!d||!d.signedIn||!d.email) return;
      serverSession=true;
      U={name:d.name||U.name,email:d.email};
      save();
      if(view==="login"){goto("landing",0,true);announce(t(UI.hiBack));}
      else render();
    })
    .catch(function(){});
}

load();
if(!signedIn()) view="login";
goto(view,qi,true);
checkSession();
